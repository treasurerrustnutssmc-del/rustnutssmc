<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coming Soon | Rustnuts SMC</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

<link rel="preload" href="fonts/RustnutsStencil-Regular.ttf" as="font" type="font/ttf" crossorigin />
<link rel="stylesheet" href="styles.css" />

<style>
  /* page-specific overrides / additions on top of styles.css */
  /* this standalone page has no header, so it doesn't want the site-wide texture overlay */
  body::before{content:none}
  body{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:28px;
    background:
      radial-gradient(circle at 72% 38%, rgba(140,28,36,0.28), transparent 55%),
      radial-gradient(circle at 20% 80%, rgba(140,28,36,0.14), transparent 50%),
      var(--ink);
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:48px}
  .brand img{height:48px;width:auto;display:block;border-radius:4px}
  .brand span{
    font-family:var(--stencil);font-weight:400;letter-spacing:0.06em;font-size:1.2rem;
  }
  h1{
    font-family:var(--stencil);font-weight:400;text-transform:uppercase;
    letter-spacing:0.01em;line-height:0.96;
    font-size:clamp(2.4rem,8vw,4.5rem);
    color:transparent;-webkit-text-stroke:2px var(--bone);
    margin-bottom:18px;
  }
  h1 .fill{color:var(--red-text);-webkit-text-stroke:0}
  p{color:var(--bone-dim);max-width:40ch;margin:0 auto 34px;font-size:1.05rem}
  .btn{border:2px solid var(--bone-dim);color:var(--bone)}
  .btn:hover{border-color:var(--red-bright);color:var(--red-text);transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="brand">
    <img src="rustnuts-smc-logo.jpg" alt="Rustnuts SMC logo" />
  </div>
  <h1><span class="fill">Coming</span><br />Soon</h1>
  <p>This page is still being built. Check back soon, or head back to the main site.</p>
  <a href="index.html" class="btn">Back To Home</a>
<script type="module">import { recordVisit } from './app/site-api.js'; recordVisit();</script>
</body>
</html>
